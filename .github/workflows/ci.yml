name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Local D1 database and Worker secrets
        run: |
          npx wrangler d1 migrations apply psg-electrical-db --local
          printf 'ADMIN_USERNAME=admin\nADMIN_PASSWORD=ci-only-password\nJWT_SECRET=ci-only-secret-not-used-anywhere-else-000000\n' > .dev.vars
      - name: Smoke test (Worker running in workerd)
        run: |
          npx vite preview --port 4173 &
          npx --yes wait-on http://localhost:4173 --timeout 90000
          BASE_URL=http://localhost:4173 npm run smoke
